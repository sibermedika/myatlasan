server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Support for 3D binary models and large medical assets
    client_max_body_size 100M;

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|otf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # 3D models caching & MIME types
    location ~* \.(?:glb|gltf|fbx|obj|mtl|3ds)$ {
        expires 14d;
        add_header Cache-Control "public, max-age=1209600, immutable";
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    # Health check for Cloud Load Balancers
    location /health {
        access_log off;
        return 200 "healthy\n";
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
